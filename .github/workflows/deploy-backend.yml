name: Deploy Backend

# Deploys backend code changes to the EC2 box: git pull, reinstall deps,
# restart the systemd service (installed by deploy/setup_ec2.sh), then
# HEALTH-GATE the result and auto-roll-back to the previous commit if the
# service does not come up healthy. Data-only refresh commits carry
# [skip ci], so CI never runs on them and this workflow never fires for
# them — data-refresh.yml handles those (no restart; event cache is
# mtime-keyed).
#
# Gating: this runs only after the CI workflow succeeds, so a red build
# never reaches EC2. NOTE: workflow_run (like schedule) only fires when the
# workflow file lives on the repo's DEFAULT branch (main). Until these
# files are merged to main, use the "Run workflow" button (workflow_dispatch)
# to deploy from cicd.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

# Shared with data-refresh.yml's deploy job: only one thing may touch the
# EC2 checkout at a time, so two runs can't race on `git reset --hard`.
concurrency:
  group: ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploy only on a successful CI run for the cicd branch, or a manual
    # dispatch. (head_branch is the branch CI ran on.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'cicd')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Detect backend changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip restarts for commits that don't touch backend code.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(Backend/|deploy/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No Backend/ or deploy/ changes in this commit; skipping deploy."
          fi

      - name: Deploy to EC2 (health-gated, auto-rollback)
        if: steps.changes.outputs.relevant == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.EC2_DEPLOY_PATH }}"
            BRANCH=cicd

            # Remember the currently-deployed commit so we can roll back to it.
            PREV="$(git rev-parse HEAD)"
            echo "Current (rollback) SHA: $PREV"

            apply() {  # $1 = git ref to deploy
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git reset --hard "$1"
              .venv/bin/pip install -r Backend/requirements.txt --quiet
              sudo systemctl restart maroonschedules
            }

            healthy() {
              sleep 5
              sudo systemctl is-active --quiet maroonschedules \
                && curl -sf -o /dev/null http://localhost:8000/health
            }

            # Roll forward to the tip of the branch.
            apply "origin/$BRANCH"
            if healthy; then
              echo "Deploy healthy at $(git rev-parse HEAD)"
              exit 0
            fi

            # Bad deploy: restore the previous commit so prod is never left
            # crash-looping (the unit has Restart=always).
            echo "ERROR: backend unhealthy after deploy — rolling back to $PREV"
            apply "$PREV"
            if healthy; then
              echo "Rolled back to $PREV; backend healthy again."
            else
              echo "CRITICAL: rollback ALSO unhealthy — manual intervention needed."
            fi
            exit 1   # fail the job loudly either way
