name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Expo config
        run: npm run check:expo

      - name: TypeScript check
        continue-on-error: true
        run: npm run typecheck

  python:
    name: Python backend checks
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DB_HOST: 127.0.0.1
      DB_CONNECT_TIMEOUT: "1"
      REDIS_URL: ""
      UPSTASH_REDIS_URL: ""
      REDIS_HOST: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Backend/requirements.txt -r TamuEventsCrawler/requirements.txt

      - name: Run backend and crawler checks
        run: python scripts/run_backend_ci_tests.py
