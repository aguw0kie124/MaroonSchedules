name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend smoke check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Expo config
        run: npm run check:expo

      - name: TypeScript check
        continue-on-error: true
        run: npm run typecheck

  python:
    name: Python backend checks
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DB_HOST: 127.0.0.1
      DB_CONNECT_TIMEOUT: "1"
      REDIS_URL: ""
      UPSTASH_REDIS_URL: ""
      REDIS_HOST: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Backend/requirements.txt -r TamuEventsCrawler/requirements.txt

      - name: Run backend and crawler checks
        run: python scripts/run_backend_ci_tests.py

      # Nothing else in CI reads events.jsonl, so a hand-edit that corrupts it
      # lands unnoticed (this happened once already -- 053d19b "rejoin TAMU
      # event record split across two JSONL lines" mangled a valid record).
      # The automated refresh validates at crawl time; this covers the manual
      # path with the same code. --absolute-only skips the comparison guards,
      # which are meaningless here: both sides would be committed data, and a
      # PR branched before a weekly refresh would fail just for being behind.
      - name: Validate committed event data
        run: |
          python scripts/validate_refresh.py --campus tamu \
            --new TamuEventsCrawler/data/normalized/events.jsonl \
            --absolute-only --report /tmp/committed-data.json
