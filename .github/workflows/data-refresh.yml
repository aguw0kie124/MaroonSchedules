name: Data Refresh

# Reruns the TAMU + UTD event crawlers, validates the output against the
# committed data (schema, dates, no sharp drop in upcoming events), then
# commits the refreshed events.jsonl files and pulls them onto the EC2
# backend. On any failure nothing is committed and one issue is opened.

on:
  schedule:
    - cron: "0 13 */2 * *" # every other day at 13:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Crawl + validate only; skip commit and deploy"

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

env:
  TARGET_BRANCH: agentic # TODO: switch to main once merged

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install crawler dependencies
        run: pip install -r TamuEventsCrawler/requirements.txt

      - name: Crawl TAMU events
        working-directory: TamuEventsCrawler
        run: python crawler.py crawl --all

      - name: Crawl UTD events
        run: python UtdEventsCrawler/crawler.py crawl

      - name: Validate refreshed data
        run: |
          python scripts/validate_refresh.py --campus tamu \
            --new TamuEventsCrawler/data/normalized/events.jsonl \
            --old-ref HEAD --report refresh-report/tamu.json
          python scripts/validate_refresh.py --campus utd \
            --new UtdEventsCrawler/data/normalized/events.jsonl \
            --old-ref HEAD --report refresh-report/utd.json

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: refresh-report/
          if-no-files-found: ignore

      - name: Commit refreshed events
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f TamuEventsCrawler/data/normalized/events.jsonl \
                     UtdEventsCrawler/data/normalized/events.jsonl
          if git diff --cached --quiet; then
            echo "No event changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh campus events [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[data-refresh] Refresh failed on $(date -u +%F)" \
            --label "data-refresh,automation" \
            --body "Crawl or validation failed; no data was committed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (refresh-report artifact has details)."

  deploy:
    needs: refresh
    if: needs.refresh.outputs.committed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull refreshed data on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "${{ vars.EC2_DEPLOY_PATH }}"
            git fetch origin agentic
            git checkout agentic
            git reset --hard origin/agentic
            # Backend picks up the new files automatically: its event cache is
            # keyed on file mtime with a 300s TTL, so no restart is needed.

  review:
    needs: [refresh, deploy]
    if: needs.refresh.outputs.committed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger agentic data review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run data-refresh-review.lock.yml \
            --repo "${{ github.repository }}" \
            --ref "$TARGET_BRANCH" \
            -f refresh_sha="${{ needs.refresh.outputs.sha }}" \
            -f refresh_run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
