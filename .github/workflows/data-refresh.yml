name: Data Refresh

# Reruns the TAMU event crawler, validates the output against the committed
# data (schema, dates, no sharp drop in upcoming events), then commits the
# refreshed events.jsonl and copies it onto the EC2 backend. On any failure
# nothing is committed and one issue is opened.
#
# UTD IS INTENTIONALLY NOT CRAWLED HERE. No client ever asks for it:
# Frontend/api/client.ts sends no `campus` param and Backend/routers/
# campus_hub.py defaults to "tamu", so UTD data is unreachable from the app.
# The crawler and the backend's `utd` source config are deliberately KEPT --
# crawler-health.md still exercises the UTD parsers daily. To re-enable when
# a campus selector ships, restore it in two places:
#   1. this file -- the "Crawl UTD events" step, the second validate_refresh
#      call, the `git add -f` path, and the deploy job's file list;
#   2. data-refresh-review.md -- the review/utd.json report and the prompt
#      bullets naming it, then run `gh aw compile`.

on:
  schedule:
    - cron: "0 13 * * 1" # weekly, Mondays at 13:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Crawl + validate only; skip commit and deploy"
      deploy_only:
        type: boolean
        default: false
        description: "Skip the crawl; just copy the committed data to EC2 (retry a failed deploy)"

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

env:
  TARGET_BRANCH: main

jobs:
  refresh:
    # deploy_only reruns just the EC2 copy, for when the data committed fine
    # but the transport failed (a stale EC2_HOST, SSH timeout). Without it a
    # failed deploy has no retry path at all: the data is already on main, so
    # a rerun finds no diff, sets committed=false, and skips the deploy again.
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install crawler dependencies
        run: pip install -r TamuEventsCrawler/requirements.txt

      - name: Crawl TAMU events
        working-directory: TamuEventsCrawler
        run: python crawler.py crawl --all

      - name: Validate refreshed data
        run: |
          python scripts/validate_refresh.py --campus tamu \
            --new TamuEventsCrawler/data/normalized/events.jsonl \
            --old-ref HEAD --report refresh-report/tamu.json

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: refresh-report/
          if-no-files-found: ignore

      - name: Commit refreshed events
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `crawl --all` also rewrites the eight tracked CSV summaries under
          # TamuEventsCrawler/output/ (crawler.py -> generate_all_summaries).
          # They are NOT gitignored, so leaving them dirty makes the
          # `git pull --rebase` below abort with "you have unstaged changes"
          # and nothing ever gets pushed. Nothing in Backend/ or Frontend/
          # reads them, so discard them.
          git checkout -- TamuEventsCrawler/output || true

          git add -f TamuEventsCrawler/data/normalized/events.jsonl
          # Scoped to the data file so `committed=true` means exactly
          # "events.jsonl changed" -- the precondition the deploy job needs.
          if git diff --cached --quiet -- TamuEventsCrawler/data/normalized/events.jsonl; then
            echo "No event changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): refresh campus events [skip ci]"
          # autostash: belt-and-braces if the crawler ever starts writing
          # some other tracked file we have not accounted for.
          git -c rebase.autoStash=true pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "[data-refresh] Refresh failed on $(date -u +%F)" \
            --label "data-refresh,automation" \
            --body "Crawl or validation failed; no data was committed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (refresh-report artifact has details)."

  deploy:
    needs: refresh
    # !cancelled() so this still evaluates when `refresh` was skipped by
    # deploy_only -- a skipped need would otherwise skip this job too.
    if: ${{ !cancelled() && (needs.refresh.outputs.committed == 'true' || inputs.deploy_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with deploy-backend.yml: serialize all access to the EC2
    # checkout so two runs never race on `git reset --hard`.
    concurrency:
      group: ec2-deploy
      cancel-in-progress: false
    steps:
      - name: Update event data on EC2 (data file only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd "${{ vars.EC2_DEPLOY_PATH }}"
            DATA=TamuEventsCrawler/data/normalized/events.jsonl

            # Backend deploys are MANUAL (ENABLE_AUTO_DEPLOY is unset), so
            # origin/main is routinely AHEAD of the code running here. A
            # `git reset --hard origin/main` would drop undeployed backend
            # code onto disk, where it would silently go live on the next
            # crash or reboot restart -- bypassing the health gate in
            # deploy-backend.yml. So move ONLY the event data file and leave
            # HEAD on the last manually-deployed commit.
            git fetch --quiet origin main
            WANT="$(git rev-parse "FETCH_HEAD:$DATA")"

            # Write to a temp file and rename rather than checking out in
            # place. rename(2) is atomic, so an in-flight request can never
            # read a half-written file (load_campus_events skips unparseable
            # lines *silently*, so a torn read would poison the cache for
            # 300s with no error), and it guarantees a fresh mtime -- the
            # backend event cache is keyed on st_mtime_ns, and git checkout
            # skips rewriting files whose stat data already matches.
            git cat-file blob "$WANT" > "$DATA.tmp"
            mv -f "$DATA.tmp" "$DATA"

            GOT="$(git hash-object -- "$DATA")"
            if [ "$GOT" != "$WANT" ]; then
              echo "ERROR: $DATA hashes to $GOT, expected $WANT"
              exit 1
            fi
            echo "Data updated: $WANT ($(wc -l < "$DATA") rows)"
            echo "Backend code left at $(git rev-parse --short HEAD) (by design)."

            # Prime the cache so the app serves fresh events in seconds
            # rather than waiting out the 300s TTL. refresh=true bypasses the
            # read cache and rewrites the shared Redis key for every other
            # reader. Best-effort: the data is live within 300s regardless.
            curl -sf -o /dev/null "http://localhost:8000/campus/events?refresh=true&limit=1" \
              && echo "Event cache primed." \
              || echo "WARN: prime failed; data still goes live within 300s."

  # Optional Gemini-powered quality audit. Skipped unless the repo variable
  # ENABLE_AGENTIC_REVIEW is set to "true" (and it needs the GEMINI_API_KEY
  # secret). Costs Gemini API tokens when enabled; the refresh/deploy above
  # never depend on it.
  review:
    # Depends on `refresh` only, NOT `deploy`: this reviews data quality, so a
    # transport failure (SSH timeout, stale host) should not also cost us the
    # quality check on data that committed perfectly well.
    needs: refresh
    if: needs.refresh.outputs.committed == 'true' && vars.ENABLE_AGENTIC_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger agentic data review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run data-refresh-review.lock.yml \
            --repo "${{ github.repository }}" \
            --ref "$TARGET_BRANCH" \
            -f refresh_sha="${{ needs.refresh.outputs.sha }}" \
            -f refresh_run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
