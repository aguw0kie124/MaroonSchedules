  # ── RSS/iCal feed directory ─────────────────────────────────────
  - name: feeds
    type: rss_directory
    url: "https://calendar.tamu.edu/feeds/"
    priority: high
    campus_filter: college_station

  # ── GetInvolved (events page) ───────────────────────────────────
  - name: getinvolved_events
    type: html
    url: "https://getinvolved.tamu.edu/events"
    parser: getinvolved_events
    priority: high
    campus_filter: college_station

  # ── GetInvolved (org discovery) ─────────────────────────────────
  - name: getinvolved_orgs
    type: html_pagination
    base_url: "https://getinvolved.tamu.edu/organizations"
    page_pattern: "?page={page}"
    max_pages: 50
    parser: getinvolved_orgs
    priority: medium
    campus_filter: college_station

  # ── NEW: GetInvolved search queries (engineering/SEC orgs) ──────
  - name: getinvolved_search_engineering
    type: html_search
    base_url: "https://getinvolved.tamu.edu/events"
    queries:
      - "SEC"
      - "Student Engineers Council"
      - "engineering"
      - "ASME"
      - "IEEE"
      - "AIChE"
      - "SHPE"
      - "NSBE"
      - "SWE"
    parser: getinvolved_search
    priority: high
    campus_filter: college_station

  - name: getinvolved_search_cultural
    type: html_search
    base_url: "https://getinvolved.tamu.edu/events"
    queries:
      - "PhilSA"
      - "TASA"
      - "cultural"
      - "international students"
      - "MSC CAMAC"
      - "ALPFA"
    parser: getinvolved_search
    priority: high
    campus_filter: college_station
